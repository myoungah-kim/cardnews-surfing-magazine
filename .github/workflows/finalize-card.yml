name: 확정 / 폐기

# Telegram 의 Upload / Drop 버튼이 이 워크플로를 깨운다.
# 무거운 작업이 없어 대개 1분 안에 끝난다.
on:
  repository_dispatch:
    types: [finalize-card]
  workflow_dispatch:
    inputs:
      date:
        description: '후보 날짜 (YYYY-MM-DD)'
        required: true
      index:
        description: '후보 순번'
        required: true
      decision:
        description: 'uploaded 또는 dropped'
        required: true

concurrency:
  # 처리 로그 CSV 를 동시에 쓰지 않도록 전체 직렬화한다.
  group: finalize
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      EVENT_DATE: ${{ github.event.client_payload.date || inputs.date }}
      EVENT_INDEX: ${{ github.event.client_payload.index || inputs.index }}
      EVENT_DECISION: ${{ github.event.client_payload.decision || inputs.decision }}
    steps:
      - uses: actions/checkout@v4

      # actions/checkout 은 이 실행이 "큐에 들어간 시점"의 커밋을 체크아웃한다.
      # 위 concurrency 락 때문에 실제 실행은 그보다 늦게(앞선 실행이 끝난 뒤)
      # 시작되는데, 그 사이 앞선 실행이 커밋을 남겼어도 이 체크아웃엔 반영되지
      # 않는다. 그 상태로 finalize.mjs 가 돌면 이미 게시된 걸 "아직 안 게시됨"
      # 으로 오판해 인스타그램에 이미지·릴즈를 중복으로 올린다(2026-07-31 실사례
      # — 두 실행이 2초 간격으로 큐에 들어갔고, 둘 다 게시까지 끝난 뒤에야 뒤의
      # 실행이 git push 충돌로 실패를 알아챘다. 게시는 이미 되돌릴 수 없었다).
      # 인스타그램 게시 코드가 돌기 전에 반드시 최신 커밋을 다시 받아야 한다.
      - name: 최신 커밋으로 갱신 (대기 중 다른 실행이 커밋했을 수 있음)
        run: git pull --ff-only

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 상태 갱신 및 처리 로그 기록
        id: run
        run: node automation/scripts/finalize.mjs

      # always() 가 핵심이다. 이미지·릴즈 중 하나만 성공한 부분 실패에서도
      # finalize.mjs 는 성공한 쪽의 permalink 를 후보 파일에 적어둔다. 그 기록이
      # 커밋되지 않으면 러너와 함께 사라지고, 다시 Upload 를 눌렀을 때 이미 올라간
      # 게시물을 "아직 안 올렸다"고 판단해 **중복 게시**하게 된다.
      - name: 결과 커밋
        if: always() && steps.run.outputs.changed == 'true'
        run: |
          automation/scripts/commit-push.sh \
            "chore: ${{ env.EVENT_DECISION }} — ${{ env.EVENT_DATE }} #${{ env.EVENT_INDEX }}"

      - name: 실패 알림
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node automation/scripts/notify.mjs "확정/폐기 처리가 실패했습니다."
