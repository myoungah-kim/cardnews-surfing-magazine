name: 웹훅 배포

# Cloudflare Worker 를 배포하고, 워커 시크릿을 GitHub Secrets 기준으로 동기화한다.
# 값을 GitHub 한 곳에만 두기 위한 구성 — Cloudflare 대시보드에서 따로 관리하지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'automation/worker/**'
      - 'automation/core/**'
      - 'automation/app/**'
      - 'automation/wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
    inputs:
      register_webhook:
        description: 'Telegram 웹훅도 다시 등록할지'
        type: boolean
        default: true

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4 는 Node 22 이상을 요구한다.
          node-version: '22'

      - name: 의존성 설치
        run: npm ci

      - name: 워커 배포
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          # 배포 출력에서 workers.dev URL 을 뽑아 다음 스텝(웹훅 등록)에 넘긴다.
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "배포 URL: ${URL:-(찾지 못함)}"

      - name: 워커 시크릿 동기화
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_ID }}
          # GitHub 은 GITHUB_ 로 시작하는 시크릿 이름을 금지하므로 다른 이름으로 저장하고
          # 워커 안에서 쓰는 이름(GITHUB_TOKEN)으로 여기서 매핑한다.
          REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # 값이 로그에 남지 않도록 node 로 JSON 을 만들어 파일로 전달한다.
          node -e '
            const keys = {
              TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
              TELEGRAM_WEBHOOK_SECRET: process.env.TELEGRAM_WEBHOOK_SECRET,
              TELEGRAM_ALLOWED_CHAT_IDS: process.env.TELEGRAM_ALLOWED_CHAT_IDS,
              GITHUB_TOKEN: process.env.REPO_DISPATCH_TOKEN,
            };
            const missing = Object.entries(keys).filter(([, v]) => !v).map(([k]) => k);
            if (missing.length) {
              console.error("GitHub Secrets 에 다음 값이 없습니다: " + missing.join(", "));
              process.exit(1);
            }
            require("node:fs").writeFileSync("/tmp/secrets.json", JSON.stringify(keys));
          '
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Telegram 웹훅 등록
        if: inputs.register_webhook != false
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          CONFIGURED_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # 커스텀 도메인을 쓰는 경우를 위해 시크릿 값이 있으면 그걸 우선한다.
          export TELEGRAM_WEBHOOK_URL="${CONFIGURED_URL:-$DEPLOYED_URL}"
          if [ -z "$TELEGRAM_WEBHOOK_URL" ]; then
            echo "웹훅 URL 을 확인할 수 없습니다. TELEGRAM_WEBHOOK_URL 시크릿을 설정하세요."
            exit 1
          fi
          node scripts/set-webhook.mjs
          node scripts/set-webhook.mjs --info
