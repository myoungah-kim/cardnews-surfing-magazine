name: 카드뉴스 제작

# Telegram 의 Choose / Recreate 버튼이 Cloudflare Worker 를 거쳐 이 워크플로를 깨운다.
on:
  repository_dispatch:
    types: [produce-card]
  workflow_dispatch:
    inputs:
      date:
        description: '후보 날짜 (YYYY-MM-DD)'
        required: true
      index:
        description: '후보 순번'
        required: true
      feedback:
        description: '수정 요청 (재생성일 때만)'
        required: false
      photo_file_id:
        description: 'Telegram 사진 file_id (재생성 시 사용자가 첨부한 참고 사진, 선택)'
        required: false

concurrency:
  # 같은 후보에 대한 중복 실행만 막는다. 서로 다른 후보는 병렬로 만들어도 무방.
  group: produce-${{ github.event.client_payload.date || inputs.date }}-${{ github.event.client_payload.index || inputs.index }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENT_DATE: ${{ github.event.client_payload.date || inputs.date }}
      EVENT_INDEX: ${{ github.event.client_payload.index || inputs.index }}
      EVENT_FEEDBACK: ${{ github.event.client_payload.feedback || inputs.feedback }}
      EVENT_PHOTO_FILE_ID: ${{ github.event.client_payload.photoFileId || inputs.photo_file_id }}
      EVENT_REPLY_MESSAGE_ID: ${{ github.event.client_payload.replyMessageId }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 크롬 확인
        run: |
          which google-chrome || which google-chrome-stable || {
            echo "러너에 크롬이 없습니다."; exit 1;
          }
          google-chrome --version

      - name: ffmpeg 확인
        run: |
          which ffmpeg || { echo "러너에 ffmpeg 가 없습니다."; exit 1; }
          ffmpeg -version | head -1

      - name: 정책 검사 및 제작 준비
        id: prep
        run: node automation/scripts/prepare-produce.mjs

      - name: 스톡 이미지 API 키 주입
        if: steps.prep.outputs.allowed == 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          {
            echo "UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY"
            echo "UNSPLASH_APP_NAME=cardnews-surfing-magazine"
            echo "PEXELS_API_KEY=$PEXELS_API_KEY"
            echo "PIXABAY_API_KEY=$PIXABAY_API_KEY"
          } > .env

      - name: Claude Code 설치
        if: steps.prep.outputs.allowed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 카드뉴스 제작
        if: steps.prep.outputs.allowed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ARTICLE_TITLE: ${{ steps.prep.outputs.title }}
          ARTICLE_URL: ${{ steps.prep.outputs.url }}
          CARD_SLUG: ${{ steps.prep.outputs.slug }}
          ATTEMPT: ${{ steps.prep.outputs.attempts }}
          FEEDBACK: ${{ steps.prep.outputs.feedback }}
          USER_PHOTO_PATH: ${{ steps.prep.outputs.photo_path }}
        run: |
          set -euo pipefail
          node automation/scripts/render-prompt.mjs prompts/produce-card.md > /tmp/prompt.txt
          claude -p "$(cat /tmp/prompt.txt)" \
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep,WebFetch,WebSearch,Skill"

      # 음원 원본은 라이선스상 저장소에 둘 수 없어 암호화본만 커밋돼 있다.
      # 여기서 러너 임시 폴더에만 풀고, 저장소 안에는 절대 쓰지 않는다.
      - name: 배경음악 복호화
        if: steps.prep.outputs.allowed == 'true'
        env:
          BGM_PASSPHRASE: ${{ secrets.BGM_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BGM_PASSPHRASE" || { echo "BGM_PASSPHRASE 시크릿이 설정되지 않았습니다."; exit 1; }
          test -f input/bgm/bgm.mp3.gpg || { echo "암호화된 배경음악(input/bgm/bgm.mp3.gpg)이 없습니다."; exit 1; }
          gpg --batch --yes --quiet --decrypt \
            --passphrase-fd 0 \
            --output "$RUNNER_TEMP/bgm.mp3" \
            input/bgm/bgm.mp3.gpg <<< "$BGM_PASSPHRASE"
          test -s "$RUNNER_TEMP/bgm.mp3" || { echo "복호화 결과가 비어 있습니다."; exit 1; }

      - name: 릴즈 영상 생성
        if: steps.prep.outputs.allowed == 'true'
        env:
          CARD_SLUG: ${{ steps.prep.outputs.slug }}
        run: |
          set -euo pipefail
          DIR="output/cards/${CARD_SLUG}"
          node automation/scripts/make-reel.mjs \
            "$DIR/card_01.png" "$RUNNER_TEMP/bgm.mp3" "$DIR/reel.mp4"

      - name: 산출물 검증
        if: steps.prep.outputs.allowed == 'true'
        env:
          CARD_SLUG: ${{ steps.prep.outputs.slug }}
        run: |
          set -euo pipefail
          DIR="output/cards/${CARD_SLUG}"
          test -f "$DIR/card_01.png" || { echo "카드 이미지가 없습니다: $DIR/card_01.png"; exit 1; }
          test -f "$DIR/caption.md"  || { echo "캡션이 없습니다: $DIR/caption.md"; exit 1; }
          # 규격(1080x1350)에서 벗어난 이미지가 그대로 올라가는 것을 막는다.
          SIZE=$(node -e "
            const b=require('node:fs').readFileSync('$DIR/card_01.png');
            console.log(b.readUInt32BE(16)+'x'+b.readUInt32BE(20));
          ")
          echo "카드 규격: $SIZE"
          test "$SIZE" = "1080x1350" || { echo "규격이 1080x1350 이 아닙니다"; exit 1; }
          # 인스타그램 캡션 상한(2200자)을 여기서 미리 걸러낸다. 여기서 안 걸러지면
          # 검수까지 통과한 뒤 Upload 시점에야 Graph API 400 으로 실패한다 —
          # 이 실행 안에서 Claude 가 바로 캡션을 손볼 수 있을 때 잡는 게 낫다.
          CAPTION_LEN=$(node -e "console.log(require('node:fs').readFileSync('$DIR/caption.md','utf8').trim().length)")
          echo "캡션 길이: ${CAPTION_LEN}자"
          test "$CAPTION_LEN" -le 2200 || { echo "캡션이 인스타그램 상한(2200자)을 넘었습니다: ${CAPTION_LEN}자"; exit 1; }
          # 릴즈 규격 확인. 깨진 영상이 커밋되면 Upload 시점에야 Graph API 가 거절한다.
          test -f "$DIR/reel.mp4" || { echo "릴즈 영상이 없습니다: $DIR/reel.mp4"; exit 1; }
          REEL_SPEC=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -show_entries format=duration \
            -of csv=p=0:s=x "$DIR/reel.mp4" | tr -d '\n')
          echo "릴즈 규격: $REEL_SPEC"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x \
            "$DIR/reel.mp4" | grep -qx '1080x1920' || { echo "릴즈가 1080x1920 이 아닙니다"; exit 1; }
          # 오디오 트랙이 빠진 채 인코딩되는 사고를 잡는다 (음악이 릴즈의 핵심).
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 \
            "$DIR/reel.mp4" | grep -qx 'audio' || { echo "릴즈에 오디오 트랙이 없습니다"; exit 1; }

      - name: 산출물 커밋
        if: steps.prep.outputs.allowed == 'true'
        run: |
          automation/scripts/commit-push.sh \
            "feat: 카드뉴스 제작 ${{ steps.prep.outputs.slug }} (${{ steps.prep.outputs.attempts }}회차)"

      - name: 검수 요청 발송
        if: steps.prep.outputs.allowed == 'true'
        run: node automation/scripts/send-result.mjs

      # send-result 가 상태를 review 로 바꾼다. 이 커밋이 없으면 그 변경이
      # 러너와 함께 사라져 후보가 producing 에 갇히고, 이후 Upload·Recreate 가
      # "아직 검수할 카드가 없습니다" 로 전부 거부된다.
      - name: 검수 대기 상태 커밋
        if: steps.prep.outputs.allowed == 'true'
        run: |
          automation/scripts/commit-push.sh \
            "chore: ${{ steps.prep.outputs.slug }} 검수 대기로 전환" \
            output/candidates/

      - name: 실패 시 상태 복구 및 알림
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node automation/scripts/reset-status.mjs || true
          automation/scripts/commit-push.sh "chore: 제작 실패 상태 복구" output/candidates/ || true
          # Choose/Recreate 버튼은 클릭 즉시 제거된다(중복 클릭 방지) — 이 시점엔
          # 실패한 그 버튼이 이미 사라진 뒤이므로 "다시 눌러주세요"는 누를 곳이
          # 없는 안내다. 항상 유효한 수동 재시도 명령을 정확히 알려준다.
          RETRY_CMD="gh workflow run \"카드뉴스 제작\" -f date=${EVENT_DATE} -f index=${EVENT_INDEX}"
          if [ -n "${EVENT_FEEDBACK}" ] || [ -n "${EVENT_PHOTO_FILE_ID}" ]; then
            node automation/scripts/notify.mjs "카드 재생성이 실패했습니다. 검수 버튼은 이미 사라진 상태입니다. '검수 재발송' 워크플로를 실행해 Upload/Recreate/Drop 버튼을 다시 받거나, 다음 명령으로 직접 재시도하세요 (수정 요청은 -f feedback=\"...\" 로 다시 붙이면 됩니다): ${RETRY_CMD}"
          else
            node automation/scripts/notify.mjs "카드뉴스 제작이 실패했습니다. Choose 버튼은 이미 사라진 상태입니다. 다음 명령으로 재시도하세요: ${RETRY_CMD}"
          fi
